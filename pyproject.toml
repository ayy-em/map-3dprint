[project]
name = "map-3dprint"
version = "0.1.0"
description = "Generate 3D-printable city map tiles (STL) around an address, from OpenStreetMap"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "manifold3d>=3.5.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "requests>=2.34.2",
    "shapely>=2.2.0",
]

[project.scripts]
map-3dprint = "map_3dprint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/map_3dprint"]
